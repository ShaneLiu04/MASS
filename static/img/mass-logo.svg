<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="36" y2="36">
      <stop offset="0%" stop-color="#1e3a5f"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="center" x1="12" y1="12" x2="24" y2="24">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="0.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect x="1" y="1" width="34" height="34" rx="7" fill="url(#bg)" stroke="#1e293b" stroke-width="1"/>

  <!-- Agent network -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <!-- Hexagon outline -->
    <path d="M18,8 L27,13 L27,23 L18,28 L9,23 L9,13 Z"
          fill="none" stroke="#06b6d4" stroke-width="0.9" stroke-opacity="0.3"/>
    <!-- Spokes to center -->
    <path d="M18,8 L18,18 M27,13 L18,18 M27,23 L18,18 M18,28 L18,18 M9,23 L18,18 M9,13 L18,18"
          stroke="#22d3ee" stroke-width="0.8" stroke-opacity="0.35"/>
    <!-- 6 agent nodes -->
    <circle cx="18" cy="8"  r="1.8" fill="#06b6d4"/>
    <circle cx="27" cy="13" r="1.8" fill="#3b82f6"/>
    <circle cx="27" cy="23" r="1.8" fill="#a855f7"/>
    <circle cx="18" cy="28" r="1.8" fill="#ef4444"/>
    <circle cx="9" cy="23" r="1.8" fill="#f97316"/>
    <circle cx="9" cy="13" r="1.8" fill="#eab308"/>
    <!-- Chairman hub -->
    <circle cx="18" cy="18" r="3.8" fill="#0f172a" stroke="url(#center)" stroke-width="1.2" filter="url(#glow)"/>
    <circle cx="18" cy="18" r="1.8" fill="url(#center)"/>
  </g>
</svg>
